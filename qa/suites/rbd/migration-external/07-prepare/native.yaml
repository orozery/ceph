tasks:
  - exec:
      cluster2.client.0:
        - echo '{"type":"qcow","stream":{"type":"http","url":"http://download.ceph.com/qa/ubuntu-12.04.qcow2"}}' | rbd migration prepare --import-only --source-spec-path - client.0.0
        - rbd migration execute client.0.0
        - rbd migration commit client.0.0
        - rbd snap create client.0.0@snap
      cluster1.client.0:
        - echo '{"type":"native","cluster_name":"cluster2","client_name":"client.migrator","pool_name":"rbd","image_name":"client.0.0","snap_name":"snap"}' | rbd migration prepare --import-only --source-spec-path - client.0.0

